name: Feature request
description: Propose a new capability or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which workflow is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The smallest change that solves the problem.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options and why they were discarded.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Product behaviour
        - Self-hosting
        - Documentation
        - Developer experience
    validations:
      required: true
