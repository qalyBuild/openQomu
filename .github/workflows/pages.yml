name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PRODUCT_NAME: ${{ vars.VITE_PRODUCT_NAME || 'openQomu' }}
          VITE_DEMO_MODE: 'true'
          VITE_DEMO_AUTO: 'true'
          VITE_PUBLIC_APP_URL: https://demo.openqomu.qaly.dev
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FILE_STORAGE: ${{ vars.VITE_FILE_STORAGE }}
          VITE_FILES_URL: ${{ vars.VITE_FILES_URL }}
          VITE_PUSH_URL: ${{ vars.VITE_PUSH_URL }}
          VITE_MCP_URL: ${{ vars.VITE_MCP_URL }}
          VITE_APK_URL: ${{ vars.VITE_APK_URL }}
          VITE_LANDING_URL: https://openqomu.qaly.dev
      - name: Fallback de rutas para Pages
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  landing:
    name: Landing (Firebase Hosting)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Desplegar landing en Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_QOMU_APP }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "::error::Falta el secreto FIREBASE_SERVICE_ACCOUNT_QOMU_APP"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@15 deploy --only hosting \
            --config landing/firebase.json --project qomu-app --non-interactive
