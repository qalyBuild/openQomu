name: Secrets

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: Escaneo de secretos y valores privados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # gitleaks-action exige licencia en organizaciones; el binario es libre.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --redact --verbose
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valores privados del árbol
        run: node scripts/check-no-private-values.mjs
