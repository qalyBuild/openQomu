<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b12" />
    <title>openQomu — Tu equipo, en sintonía</title>
    <meta
      name="description"
      content="openQomu reúne chat, kanban y documentos en un espacio de trabajo autoalojable, rápido y en tiempo real."
    />
    <meta property="og:title" content="openQomu — Tu equipo, en sintonía" />
    <meta
      property="og:description"
      content="Conversaciones, tareas y conocimiento en un solo lugar. Chat en tiempo real, tableros Kanban y documentos vivos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      ;(() => {
        try {
          const root = document.documentElement
          const raw = localStorage.getItem('openqomu.theme.cache')
          const cache = raw ? JSON.parse(raw) : null
          const legacy = localStorage.getItem('openqomu.theme')
          const scheme = cache?.scheme === 'light' || (!cache && legacy === 'light') ? 'light' : 'dark'
          const background = cache?.background ?? (scheme === 'light' ? '#fbfaff' : '#0c0b12')
          root.classList.toggle('dark', scheme === 'dark')
          root.style.backgroundColor = background
          if (cache) {
            root.style.setProperty('--background', cache.background)
            root.style.setProperty('--foreground', cache.foreground)
            root.style.setProperty('--radius', cache.radius)
          }
          const meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', background)
        } catch {
          // Preferencia no disponible.
        }
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: var(--background, #0c0b12);
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse 60% 50% at 50% 0%, color-mix(in oklch, var(--brand, #8b5cf6) 16%, transparent), transparent 70%), var(--background, #0c0b12);
        color: var(--foreground, #f5f3ff);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .boot-mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-text {
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted-foreground, #a1a1aa);
        letter-spacing: 0.02em;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: translateY(0); opacity: 1; }
        50% { transform: translateY(-4px); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div style="text-align: center">
          <div class="boot-mark">
            <svg viewBox="0 0 256 256" width="64" height="64" fill="none" aria-hidden="true">
              <path fill="#f5f3ff" d="M 18 126 L 18 81 C 18 56 37 38 62 38 L 132 38 L 132 83 L 115 100 C 103 112 96 130 80 144 L 58 165 L 37 165 C 26 165 18 156 18 145 Z"/>
              <path fill="#6038FA" d="M 112 12 L 166 12 C 195 12 216 33 216 61 L 216 128 L 176 128 L 149 106 C 137 96 129 89 113 89 L 112 89 Z"/>
              <path fill="#A89CF2" d="M 238 128 L 238 181 C 238 208 219 229 192 229 L 125 229 L 125 188 C 125 171 132 158 146 146 C 161 132 175 128 191 128 Z"/>
              <path fill="#868795" d="M 33 150 L 55 150 L 79 171 C 92 184 103 191 120 191 L 125 191 L 125 247 L 89 247 C 57 247 33 225 33 194 Z"/>
            </svg>
          </div>
          <div class="boot-text">Preparando tu espacio…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
