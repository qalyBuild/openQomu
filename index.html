<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0b12" />
    <title>openQomu — Tu equipo, en sintonía</title>
    <meta
      name="description"
      content="openQomu reúne chat, kanban y documentos en un espacio de trabajo autoalojable, rápido y en tiempo real."
    />
    <meta property="og:title" content="openQomu — Tu equipo, en sintonía" />
    <meta
      property="og:description"
      content="Conversaciones, tareas y conocimiento en un solo lugar. Chat en tiempo real, tableros Kanban y documentos vivos."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      ;(() => {
        try {
          const mode = localStorage.getItem('openqomu.theme') || 'system'
          const dark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.backgroundColor = dark ? '#0c0b12' : '#fbfaff'
        } catch {
          // Preferencia no disponible.
        }
      })()
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: #0c0b12;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(139, 92, 246, 0.16), transparent 70%), #0c0b12;
        color: #f5f3ff;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .boot-mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        animation: boot-pulse 1.6s ease-in-out infinite;
      }
      .boot-text {
        margin-top: 18px;
        font-size: 13px;
        color: #a1a1aa;
        letter-spacing: 0.02em;
      }
      @keyframes boot-pulse {
        0%, 100% { transform: translateY(0); opacity: 1; }
        50% { transform: translateY(-4px); opacity: 0.85; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot">
        <div style="text-align: center">
          <div class="boot-mark">
            <svg viewBox="0 0 48 48" width="64" height="64" fill="none" aria-hidden="true">
              <defs>
                <linearGradient id="boot-tail" x1="24" y1="24" x2="42" y2="42" gradientUnits="userSpaceOnUse">
                  <stop stop-color="#a78bfa"/>
                  <stop offset="1" stop-color="#ec4899"/>
                </linearGradient>
              </defs>
              <circle cx="21.5" cy="21.5" r="13.2" stroke="#f5f3ff" stroke-width="2.6"/>
              <path d="M25.4 25.4 41.2 41.2" stroke="url(#boot-tail)" stroke-width="2.6" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="boot-text">Preparando tu espacio…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
